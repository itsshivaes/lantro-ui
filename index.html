<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta content='#204ecf' name='theme-color'/>
<title>Lantro UI - Fast & Modern Blogger Template</title>

<!-- Logo preload  -->
<link rel="preload" as="image" href="https://cdn.coshix.in/Icons/lantro-ui-logo.webp">

<!-- Font optimize -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://fonts.gstatic.com">

<style>
:root{--contentL:#e6e6e6;--bg:#fff;--text:#111;--muted:#6b7280;--accent:#6c5ce7;--card:#ffff}
.dark{--contentL:rgba(255,255,255,.15);--bg:#0f0f11;--text:#fff;--muted:#9ca3af;--accent:#8b7cf6;--card:#1a1a1d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);transition:.3s}

/* NAV */
.nav{display:flex;border:1px solid var(--contentL);justify-content:space-between;align-items:center;padding:16px 6%;gap:10px}

/* LOGO FIX */
.logo-wrap{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo-wrap img{width:28px;height:28px;display:block;border-radius:6px}
.logo-text{font-weight:700;font-size:18px;white-space:nowrap}
.badge-v{font-size:11px;margin-left:6px;padding:2px 6px;border-radius:6px;background:var(--accent);color:#fff}

/* NAV RIGHT */
.nav-right{display:flex;align-items:center;gap:12px}
.nav a{color:var(--text);text-decoration:none;font-size:13px;white-space:nowrap}

/* TOGGLE */
.toggle{display:flex;align-items:center;justify-content:center;cursor:pointer}
.toggle svg{stroke:var(--text);width:18px;height:18px;fill:none}

/* HERO */
.hero-wrap{display:grid;border-bottom:3px dotted var(--contentL);grid-template-columns:1fr 1fr;align-items:center;padding:70px 6%;gap:40px}
.hero-left h1{font-size:44px;font-weight:700}
.hero-left span{color:var(--accent)}
.hero-left p{margin-top:18px;color:var(--muted);max-width:500px}

/* MAC WINDOW */
.mac-window{background:var(--card);border:1px solid var(--contentL);border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.1)}
.mac-bar{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--contentL)}
.dot{width:10px;height:10px;border-radius:50%}
.red{background:#ff5f57}
.yellow{background:#febc2e}
.green{background:#28c840}
.mac-body img{width:100%;display:block}

/* BUTTON */
.btn{padding:11px 20px;border-radius:30px;border:none;cursor:pointer;margin-top:22px;font-size:13px}
.btn-primary{background:var(--accent);color:#fff}

/* FEATURES */
.features{padding:60px 6%}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.fcard{background:var(--card);border:1px solid var(--contentL);padding:18px;border-radius:6px;transition:.2s}
.fcard:hover{transform:translateY(-4px)}
.icon{width:26px;height:26px;stroke:var(--text);stroke-width:1;fill:none}
.svg-c{stroke:var(--accent)}
.fcard h2{font-size:15px;margin:8px 0}
.fcard p{font-size:12px;color:var(--muted)}

/* FOOTER */
.footer{text-align:center;padding:25px;color:var(--muted);border-top:3px dotted var(--contentL)}

/* RESPONSIVE */
@media(max-width:900px){
.hero-wrap{grid-template-columns:1fr}
.hero-left h1{font-size:34px}
}

@media(max-width:600px){
.logo-text{font-size:16px}
.nav a{font-size:12px}
}

@media(max-width:420px){
.nav a:nth-child(2){display:none}
}
</style>
</head>

<body>

<div class="nav">

  <!-- LEFT -->
  <div class="logo-wrap">
    <img src="https://cdn.coshix.in/Icons/lantro-ui-logo.webp" width="28" height="28" alt="Lantro UI">
    <div class="logo-text">Lantro UI <span class="badge-v">v2.0</span></div>
  </div>

  <!-- RIGHT -->
  <div class="nav-right">
    <a href="#">Documentation</a>
    <a href="#">Blog</a>
    <span class="toggle" onclick="t()">
      <svg viewBox="0 0 24 24">
        <path d="M2 12a10 10 0 1010-10 7 7 0 000 14 7 7 0 007-7"/>
      </svg>
    </span>
  </div>

</div>

<!-- HERO -->
<div class="hero-wrap">

  <div class="hero-left">
    <h1>Get <span>fast</span> Blogger UI</h1>
    <p>Modern, lightweight, and customizable Blogger template.</p>

    <button class="btn btn-primary">Download</button>
    <button class="btn">Live Demo</button>
  </div>

  <div class="hero-right">
    <div class="mac-window">
      <div class="mac-bar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <div class="mac-body">
        <img src="https://cdn.coshix.in/Images/lui-ss.webp" alt="Preview">
      </div>
    </div>
  </div>

</div>

<!-- FEATURES -->
<div class="features">
<div class="fgrid">

<div class="fcard"><h2>Fast Loading</h2><p>Optimized for performance.</p></div>
<div class="fcard"><h2>SEO Optimized</h2><p>Better ranking support.</p></div>
<div class="fcard"><h2>Responsive</h2><p>Works on all devices.</p></div>
<div class="fcard"><h2>Customizable</h2><p>Easy to edit.</p></div>

</div>
</div>

<div class="footer">© 2026 Lantro UI</div>

<!-- DARK MODE JS -->
<script>
function t(){document.body.classList.toggle("dark");localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light")}
!function(){localStorage.getItem("theme")==="dark"&&document.body.classList.add("dark")}();
</script>

</body>
</html>
