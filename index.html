<!-- Performance -->

<!-- Font -->
<link rel="preload" as="style"

<noscript>
<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">

<style>
:root{--contentL:#e6e6e6;--bg:#fff;--text:#111;--muted:#6b7280;--accent:#6c5ce7;--card:#ffff}
.dark{--contentL:rgba(255,255,255,.15);--bg:#0f0f11;--text:#fff;--muted:#9ca3af;--accent:#8b7cf6;--card:#1a1a1d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);transition:.3s}

/* NAV */
.nav{display:flex;border:1px solid var(--contentL);justify-content:space-between;align-items:center;padding:16px 6%;gap:10px}
.logo-wrap{display:flex;align-items:center;gap:8px}
.logo-wrap img{width:28px;height:28px;border-radius:6px}
.logo-text{font-weight:700;font-size:18px}
.badge-v{font-size:11px;margin-left:6px;padding:2px 6px;border-radius:6px;background:var(--accent);color:#fff}
.nav-right{display:flex;align-items:center;gap:12px}
.nav a{color:var(--text);text-decoration:none;font-size:13px}
.toggle{cursor:pointer}

/* HERO */
.hero-wrap{display:grid;border-bottom:3px dotted var(--contentL);grid-template-columns:1fr 1fr;padding:70px 6%;gap:40px}
.hero-left h1{font-size:44px}
.hero-left span{color:var(--accent)}

/* MAC */
.mac-window{border:1px solid var(--contentL);border-radius:12px;overflow:hidden}
.mac-bar{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--contentL)}
.dot{width:10px;height:10px;border-radius:50%}
.red{background:#ff5f57}.yellow{background:#febc2e}.green{background:#28c840}
.mac-body img{width:100%}

/* RESPONSIVE */
@media(max-width:900px){
.hero-wrap{grid-template-columns:1fr}
}
</style>

</head>

<body>

<div class="nav">
  <div class="logo-wrap">
    <img src="https://cdn.coshix.in/Icons/lantro-ui-logo.webp" width="28" height="28">
    <div class="logo-text">Lantro UI <span class="badge-v">v2.0</span></div>
  </div>

  <div class="nav-right">
    <a href="#">Documentation</a>
    <a href="#">Blog</a>
    <span class="toggle" onclick="t()">🌙</span>
  </div>
</div>

<div class="hero-wrap">
  <div class="hero-left">
    <h1>Get <span>fast</span> Blogger UI</h1>
  </div>

  <div class="hero-right">
    <div class="mac-window">
      <div class="mac-bar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <div class="mac-body">
        <img src="https://cdn.coshix.in/Images/lui-ss.webp">
      </div>
    </div>
  </div>
</div>

<!-- Dark mode JS -->
<script>
function t(){document.body.classList.toggle("dark");localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light")}
!function(){localStorage.getItem("theme")==="dark"&&document.body.classList.add("dark")}();
</script>

</body>
</html>
