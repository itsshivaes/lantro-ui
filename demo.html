<style>
:root{
--bg:#fff;
--text:#111;
--muted:#6b7280;
--accent:#6c5ce7;
--card:#fff;
--border:#e5e7eb
}
.dark{
--bg:#0f0f11;
--text:#fff;
--muted:#9ca3af;
--accent:#8b7cf6;
--card:#1a1a1d;
--border:rgba(255,255,255,.1)
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);transition:.3s}

/* NAV */
.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 6%;
border-bottom:1px solid var(--border)
}
.logo{font-weight:600;font-size:20px}

/* DARK TOGGLE */
.toggle{
cursor:pointer;
padding:8px;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center
}
.toggle svg{
width:20px;
height:20px;
stroke:var(--text);
fill:none;
stroke-width:1;
stroke-linecap:round
}

/* HERO */
.hero{
text-align:center;
padding:60px 20px
}
.hero h1{font-size:34px;margin-bottom:10px}
.hero p{color:var(--muted)}

/* GRID */
.demo-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
padding:50px 8%
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:5px;
overflow:hidden;
transition:.3s
}
.card:hover{transform:translateY(-6px)}

/* IMAGE */
.preview{
height:220px;
overflow:hidden
}
.preview img{
width:100%;
height:100%;
object-fit:cover
}

/* CONTENT */
.card-body{
padding:20px
}
.card-body h3{margin-bottom:8px}
.card-body p{font-size:14px;color:var(--muted);margin-bottom:15px}

/* BUTTON */
.btn{
display:inline-block;
padding:10px 18px;
border-radius:25px;
text-decoration:none;
font-size:14px;
border:1px solid var(--border);
color:var(--text);
transition:.2s
}
.btn-primary{
background:var(--accent);
color:#fff;
border:none
}
.btn:hover{opacity:.9}

/* FOOTER */
.footer{
text-align:center;
padding:30px;
color:var(--muted);
border-top:1px solid var(--border)
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="logo">Lantro UI</div>

  <div class="toggle" onclick="t()">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M2.03009 12.42C2.39009 17.57 6.76009 21.76 11.9901 21.99C15.6801 22.15 18.9801 20.43 20.9601 17.72C21.7801 16.61 21.3401 15.87 19.9701 16.12C19.3001 16.24 18.6101 16.29 17.8901 16.26C13.0001 16.06 9.00009 11.97 8.98009 7.13996C8.97009 5.83996 9.24009 4.60996 9.73009 3.48996C10.2701 2.24996 9.62009 1.65996 8.37009 2.18996C4.41009 3.85996 1.70009 7.84996 2.03009 12.42Z"/>
    </svg>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <h1>Choose Demo Version</h1>
  <p>Preview before downloading</p>
</div>

<!-- DEMO -->
<div class="demo-grid">

  <!-- FREE -->
  <div class="card">
    <div class="preview">
      <img src="https://cdn.coshix.in/Images/lui-ss.webp" alt="Free demo">
    </div>
    <div class="card-body">
      <h3>Free Version</h3>
      <p>Basic features • Limited customization</p>

      <a href="https://lantro-ui-free.blogspot.com/" class="btn btn-primary">View Demo</a>
    </div>
  </div>

  <!-- PREMIUM -->
  <div class="card">
    <div class="preview">
      <img src="https://lantro-ui.coshix.in/image.png" alt="Premium demo">
    </div>
    <div class="card-body">
      <h3>Premium Version</h3>
      <p>All features unlocked • Full customization</p>

      <a href="https://the-lantro-ui.blogspot.com" class="btn btn-primary">View Demo</a>
    </div>
  </div>

</div>

<!-- FOOTER -->
<div class="footer">
© 2026 Lantro UI
</div>

<!-- DARK MODE -->
<script>
function t(){
 document.body.classList.toggle("dark");
 localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light")
}
if(localStorage.getItem("theme")==="dark"){
 document.body.classList.add("dark")
}
</script>

</body>
</html>
